server:
  port: 8080

spring:
  application:
    name: avalia-serv-api

  # Perfil padrao: H2 em arquivo (dados sobrevivem ao restart).
  datasource:
    url: jdbc:h2:file:./data/avaliaserv;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

avaliaserv:
  jwt:
    # Em producao use variavel de ambiente: AVALIASERV_JWT_SECRET
    secret: ${AVALIASERV_JWT_SECRET:troque-esta-chave-por-uma-com-no-minimo-32-caracteres-aleatorios}
    expiration-hours: 24
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    br.com.avaliaserv: INFO
